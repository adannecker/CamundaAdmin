name: camundaadmin
services:
  app:
    build:
      context: ../src
    image: fhnw/camundaadmin:local
    restart: unless-stopped
    user: "1002:1002"
    env_file:
      - ../secrets/openai.env
      - ../secrets/auth.env
    volumes:
      - ../data:/app/data
      - ../secrets/openai.env:/app/data/.env:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    init: true
    stop_grace_period: 90s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3300/camundaadmin/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      public_web:
        aliases: [camundaadmin]
networks:
  public_web:
    external: true
    name: competence-center-website_default
